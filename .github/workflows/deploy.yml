name: Deploy API

# Runs only when the API, what it imports from packages/shared, or what installs and deploys it
# changes. Web-only or docs-only pushes don't start it (docs/ci.md#deploy-api-and-deploy-web).
on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/shared/**
      - package.json
      - bun.lock
      - .github/workflows/deploy.yml

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile

      # The repository only contains example.com placeholders. The real domain and database
      # ID are repository variables (Settings > Secrets and variables > Actions > Variables).
      - name: Render deploy config
        run: bun scripts/render-wrangler.ts
        working-directory: apps/api
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}

      - name: Apply migrations and deploy
        uses: cloudflare/wrangler-action@v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.162.0"
          workingDirectory: apps/api
          preCommands: wrangler d1 migrations apply workbench-db --remote --config wrangler.deploy.jsonc
          command: deploy --config wrangler.deploy.jsonc
