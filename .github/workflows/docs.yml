name: Docs

# Checks the Markdown formatting of docs/ and the root *.md files. The job always runs and reports,
# so it can be a required check, but its steps are skipped unless a docs file changed (the "Scope"
# step). Fix locally with the same command without --check (see CONTRIBUTING.md).
# docs/ci.md describes this workflow.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Markdown formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Compares against the pull request's base or the pushed range. When the range can't be
      # read (a new branch, for instance), the check runs in full.
      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$BASE_PR"; else base="$BASE_PUSH"; fi
          docs=true
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && changed=$(git diff --name-only "$base" "$HEAD" 2>/dev/null); then
            if ! printf '%s\n' "$changed" | grep -Eq '(^docs/|\.md$|^\.mdformat\.toml$|^requirements-docs\.txt$|^\.github/workflows/docs\.yml$)'; then
              docs=false
            fi
          fi
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7.1.0
        if: steps.scope.outputs.docs == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install formatter
        if: steps.scope.outputs.docs == 'true'
        run: pip install -r requirements-docs.txt

      - name: Check formatting
        if: steps.scope.outputs.docs == 'true'
        run: mdformat --check --compact-tables README.md CONTRIBUTING.md AGENTS.md CLAUDE.md docs
